<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZUM — Banners do Meio</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,sans-serif;background:#f5f5f5;min-height:100vh;padding:32px 16px}
  .header{text-align:center;margin-bottom:32px}
  .header h1{font-size:28px;letter-spacing:6px;font-weight:400;margin-bottom:6px}
  .header p{font-size:13px;color:#999;letter-spacing:.5px}
  .cards{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .card{background:#fff;padding:16px;border:2px solid transparent;transition:border-color .15s}
  .card.ativo{border-color:#111}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .card-title{font-size:13px;font-weight:700;color:#111;letter-spacing:.5px}
  .toggle{position:relative;width:44px;height:24px;cursor:pointer}
  .toggle input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#ddd;border-radius:24px;transition:.2s}
  .slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
  input:checked+.slider{background:#111}
  input:checked+.slider:before{transform:translateX(20px)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:10px;color:#999;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;font-weight:600}
  .field input,.field select{width:100%;padding:10px 12px;border:1px solid #ddd;font-size:13px;color:#111;background:#fff;border-radius:0;appearance:none}
  .field input:focus,.field select:focus{outline:none;border-color:#111}
  .preview-img{width:100%;height:80px;background:#f0ece8;display:flex;align-items:center;justify-content:center;font-size:11px;color:#bbb;letter-spacing:1px;margin-bottom:12px;overflow:hidden}
  .preview-img img{width:100%;height:100%;object-fit:cover}
  .disabled .field,.disabled .preview-img{opacity:.4;pointer-events:none}
  .btn-salvar{display:block;width:100%;max-width:480px;margin:24px auto 0;padding:16px;background:#111;color:#fff;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;border:none;cursor:pointer;transition:background .15s}
  .btn-salvar:hover{background:#333}
  .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 24px;font-size:13px;border-radius:2px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  .hint{text-align:center;font-size:11px;color:#bbb;margin-bottom:20px;max-width:480px;margin-left:auto;margin-right:auto}
  .after-label{font-size:10px;color:#bbb;margin-top:4px}
</style>
</head>
<body>

<div class="header">
  <h1>ZUM</h1>
  <p>Gerencie os banners do meio da loja</p>
</div>

<div class="hint">Ative o banner, escolha o produto e onde ele aparece</div>

<div class="cards" id="cards"></div>

<button class="btn-salvar" onclick="salvar()">Salvar banners na loja</button>
<div class="toast" id="toast"></div>

<script>
var PRODUCTS = [
  {sku:'ZUM-VDRC-105', name:'Vestido recorte costas'},
  {sku:'ZUM-VDBT-102', name:'Vestido busto torcido'},
  {sku:'ZUM-TSOB-200', name:'T-shirt oversized básica'},
  {sku:'ZUM-BDAS-300', name:'Body assimétrico'}
];

var NUM_BANNERS = 3;
var banners = [];

function init(){
  var saved = localStorage.getItem('zum-banners');
  if(saved){
    try{ banners = JSON.parse(saved); }catch(e){ banners = []; }
  }
  while(banners.length < NUM_BANNERS){
    banners.push({ativo:false, sku:'', after:2, titulo:'', tag:''});
  }
  render();
}

function render(){
  var opts = PRODUCTS.map(p=>'<option value="'+p.sku+'">'+p.name+'</option>').join('');
  document.getElementById('cards').innerHTML = banners.map((b,i)=>
    '<div class="card'+(b.ativo?' ativo':'')+'" id="card'+i+'">'+
      '<div class="card-top">'+
        '<span class="card-title">Banner '+(i+1)+'</span>'+
        '<label class="toggle">'+
          '<input type="checkbox" id="ativo'+i+'" '+(b.ativo?'checked':'')+' onchange="toggleAtivo('+i+')">'+
          '<span class="slider"></span>'+
        '</label>'+
      '</div>'+
      '<div class="'+(b.ativo?'':'disabled')+'">'+
        '<div class="preview-img" id="prev'+i+'">'+
          (b.img?'<img src="'+b.img+'" onerror="this.parentNode.innerHTML=\'SEM IMAGEM\'">':(i===0?'BANNERS/MEIO/banner-meio-1/banner-meio-1.jpg':'BANNERS/MEIO/banner-meio-'+(i+1)+'/banner-meio-'+(i+1)+'.jpg'))+
        '</div>'+
        '<div class="field">'+
          '<label>Produto vinculado</label>'+
          '<select id="sku'+i+'" onchange="banners['+i+'].sku=this.value">'+
            '<option value="">— Selecione um produto —</option>'+opts+
          '</select>'+
        '</div>'+
        '<div class="field">'+
          '<label>Aparece após o produto nº</label>'+
          '<input type="number" id="after'+i+'" value="'+(b.after||2)+'" min="1" onchange="banners['+i+'].after=parseInt(this.value)">'+
          '<div class="after-label">Ex: 2 = aparece depois do 2º produto na grade</div>'+
        '</div>'+
      '</div>'+
    '</div>'
  ).join('');

  banners.forEach((b,i)=>{
    if(b.sku) document.getElementById('sku'+i).value = b.sku;
  });
}

function toggleAtivo(i){
  banners[i].ativo = document.getElementById('ativo'+i).checked;
  var card = document.getElementById('card'+i);
  card.classList.toggle('ativo', banners[i].ativo);
  card.querySelector('.card-top + div').className = banners[i].ativo?'':'disabled';
}

function salvar(){
  banners.forEach((b,i)=>{
    b.sku   = document.getElementById('sku'+i).value;
    b.after = parseInt(document.getElementById('after'+i).value)||2;
    b.img   = 'BANNERS/MEIO/banner-meio-'+(i+1)+'/banner-meio-'+(i+1)+'.jpg';
  });
  localStorage.setItem('zum-banners', JSON.stringify(banners));
  showToast('✓ Banners salvos! Recarregue a loja.');
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

init();
</script>
</body>
</html>
