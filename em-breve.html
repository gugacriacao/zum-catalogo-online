<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZUM — Leveza em Movimento</title>
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="assets/logo-preta.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --background: oklch(0.985 0.003 90);
    --foreground: oklch(0.15 0 0);
    --muted-foreground: oklch(0.55 0 0);
    --border: oklch(0.9 0.005 90);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--background); color:var(--foreground);
    font-family:'Jost',sans-serif; text-align:center; padding:24px;
  }
  .wrap{max-width:420px}
  h1{
    font-family:'Cormorant Garamond',serif; font-weight:500; font-size:2.8rem;
    letter-spacing:0.04em; margin:0 0 8px;
  }
  p{color:var(--muted-foreground); font-size:0.95rem; line-height:1.6; margin:0 0 28px}
  .btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  a.btn{
    display:inline-flex; align-items:center; gap:8px; background:var(--foreground); color:var(--background);
    text-decoration:none; padding:14px 28px; font-family:'Jost',sans-serif; font-size:0.78rem;
    letter-spacing:0.12em; text-transform:uppercase;
  }
  a.btn.outline{
    background:transparent; color:var(--foreground); border:1px solid var(--foreground);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>ZUM</h1>
    <p>Nosso site novo está quase pronto. Enquanto isso, fale com a gente pelo WhatsApp ou dá uma olhada no Instagram.</p>
    <div class="btns">
      <a class="btn" href="https://wa.me/5585981110467?text=Ol%C3%A1!%20Vim%20pelo%20site%20da%20ZUM%20e%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es." target="_blank" rel="noopener">Falar no WhatsApp</a>
      <a class="btn outline" href="https://www.instagram.com/use.zum/" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</body>
</html>
