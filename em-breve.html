<style>
  :root{
    --background: oklch(0.985 0.003 90);
    --foreground: oklch(0.15 0 0);
    --muted-foreground: oklch(0.55 0 0);
    --border: oklch(0.9 0.005 90);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--background); color:var(--foreground);
    font-family:'Jost',sans-serif; text-align:center;
  }
  .hero{
    width:100%; aspect-ratio:16/9; overflow:hidden;
  }
  .hero img{ width:100%; height:100%; object-fit:cover; object-position:center center; display:block; }
  .panel{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 24px 56px;
  }
  .wrap{max-width:420px}
  p{color:var(--muted-foreground); font-size:0.95rem; line-height:1.6; margin:0 0 28px}
  .btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  a.btn{
    display:inline-flex; align-items:center; gap:8px; background:var(--foreground); color:var(--background);
    text-decoration:none; padding:14px 28px; font-family:'Jost',sans-serif; font-size:0.78rem;
    letter-spacing:0.12em; text-transform:uppercase;
  }
  a.btn.outline{
    background:transparent; color:var(--foreground); border:1px solid var(--foreground);
  }
</style>
